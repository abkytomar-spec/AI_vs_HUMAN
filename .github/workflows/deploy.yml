name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Source changes may arrive as transfer/*.tgz or *.txz (uploaded through the GitHub web UI).
      # Unpack them, import the normalized images, and commit the result to main.
      - name: Apply source bundle and images
        run: |
          shopt -s nullglob
          bundles=(transfer/*.tgz transfer/*.txz ./*.tgz ./*.txz)
          for f in "${bundles[@]}"; do tar xaf "$f" --exclude='.github'; git rm -q --cached "$f" 2>/dev/null || true; rm -f "$f"; done
          if git ls-remote --exit-code origin ci/curate-out >/dev/null; then
            git fetch -q --depth 1 origin ci/curate-out
            mkdir -p public/images
            git archive FETCH_HEAD images | tar x -C public
          fi
          if [ ! -f package-lock.json ] && git ls-remote --exit-code origin ci/toolchain-out >/dev/null; then
            git fetch -q --depth 1 origin ci/toolchain-out
            git show FETCH_HEAD:package-lock.json > package-lock.json
          fi
          if [ -f dataset/pool.json ]; then
            python3 -c "import json;d=json.load(open('dataset/pool.json'));json.dump(d,open('dataset/pool.json','w'),indent=1,ensure_ascii=False)"
            node scripts/build-pool.mjs
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Apply source bundle and normalized images"
            git push origin HEAD:main
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-pool.mjs --check
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
